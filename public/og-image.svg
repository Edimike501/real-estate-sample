<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1210 640" role="img">
  <title>Aura Luxury Properties OG Image</title>
  <desc>Elevated Living &amp; Premium Real Estate Investments — Aura Luxury Properties brand banner</desc>

  <defs>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#03180e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#03180e" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03180e"/>
      <stop offset="100%" stop-color="#062315"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle emerald glow top-left -->
  <ellipse cx="200" cy="180" rx="400" ry="260" fill="#059669" opacity="0.08"/>

  <!-- Grid lines — blueprint feel -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#34d399" stroke-width="0.4" opacity="0.12"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#34d399" stroke-width="0.4" opacity="0.12"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#34d399" stroke-width="0.4" opacity="0.12"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#34d399" stroke-width="0.4" opacity="0.12"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#34d399" stroke-width="0.4" opacity="0.12"/>

  <!-- Right architectural panel -->
  <rect x="760" y="0" width="440" height="630" fill="#042315" opacity="0.5"/>

  <!-- Tower 1 -->
  <rect x="800" y="130" width="80" height="500" fill="#062315"/>
  <rect x="812" y="150" width="10" height="28" fill="#34d399" opacity="0.25"/>
  <rect x="830" y="150" width="10" height="28" fill="#34d399" opacity="0.15"/>
  <rect x="848" y="150" width="10" height="28" fill="#34d399" opacity="0.25"/>
  <rect x="812" y="196" width="10" height="28" fill="#34d399" opacity="0.15"/>
  <rect x="830" y="196" width="10" height="28" fill="#059669" opacity="0.4"/>
  <rect x="848" y="196" width="10" height="28" fill="#34d399" opacity="0.15"/>

  <!-- Tower 2 (tallest) -->
  <rect x="900" y="55" width="105" height="575" fill="#09331e"/>
  <rect x="913" y="75" width="13" height="34" fill="#059669" opacity="0.4"/>
  <rect x="934" y="75" width="13" height="34" fill="#34d399" opacity="0.2"/>
  <rect x="955" y="75" width="13" height="34" fill="#059669" opacity="0.4"/>

  <!-- Tower 3 -->
  <rect x="1025" y="190" width="72" height="440" fill="#062315"/>
  <rect x="1037" y="210" width="11" height="27" fill="#34d399" opacity="0.3"/>
  <rect x="1056" y="210" width="11" height="27" fill="#059669" opacity="0.35"/>

  <!-- Fade overlay blending buildings into left -->
  <rect x="680" y="0" width="180" height="630" fill="url(#fadeRight)"/>

  <!-- Right edge fade -->
  <rect x="1120" y="0" width="80" height="630" fill="#03180e" opacity="0.6"/>

