  <text x="60" y="108" font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#34d399" letter-spacing="4" font-weight="500">LUXURY REAL ESTATE</text>

  <!-- Company name -->
  <text x="58" y="202" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="700" fill="#ecfdf5" letter-spacing="-1">Aura</text>
  <text x="58" y="291" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="700" fill="#34d399" letter-spacing="-1">Luxury</text>
  <text x="58" y="380" font-family="'Cormorant Garamond', Georgia, serif" font-size="76" font-weight="700" fill="#ecfdf5" letter-spacing="-1">Properties</text>

  <!-- Divider -->
  <rect x="60" y="408" width="380" height="0.8" fill="#34d399" opacity="0.25"/>

  <!-- Tagline -->
  <text x="60" y="442" font-family="'DM Sans', Arial, sans-serif" font-size="17" fill="#a7f3d0" letter-spacing="0.5">Elevated Living &amp; Premium Real Estate Investments</text>

  <!-- Stats -->
  <text x="60" y="504" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="700" fill="#34d399">200+</text>
  <text x="60" y="528" font-family="'DM Sans', Arial, sans-serif" font-size="11" fill="#5eead4" letter-spacing="1.5">PROPERTIES SOLD</text>

  <rect x="188" y="482" width="0.8" height="54" fill="#34d399" opacity="0.2"/>

  <text x="208" y="504" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="700" fill="#34d399">12+</text>
  <text x="208" y="528" font-family="'DM Sans', Arial, sans-serif" font-size="11" fill="#5eead4" letter-spacing="1.5">YEARS EXPERIENCE</text>

  <rect x="348" y="482" width="0.8" height="54" fill="#34d399" opacity="0.2"/>

  <text x="368" y="504" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" font-weight="700" fill="#34d399">500+</text>
  <text x="368" y="528" font-family="'DM Sans', Arial, sans-serif" font-size="11" fill="#5eead4" letter-spacing="1.5">HAPPY CLIENTS</text>

  <!-- Bottom accent -->
  <rect x="60" y="572" width="52" height="3" fill="#059669" opacity="0.6"/>

  <!-- URL -->
  <text x="60" y="603" font-family="'DM Sans', Arial, sans-serif" font-size="12" fill="#166534" letter-spacing="1">auraluxuryproperties.com</text>
</svg>